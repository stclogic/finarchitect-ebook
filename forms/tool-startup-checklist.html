<style>
:root{ --ink:#0F172A; --muted:#64748B; --line:#E7EAF0; --primary:#4F46E5; --primary2:#7C3AED; --up:#059669; --soft:#F8FAFC; }
.ck-wrap{ max-width:760px; margin:0 auto; padding:2.4rem 1.4rem 5rem; color:var(--ink);
  font-family:'Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif; }
.ck-back{ display:inline-flex; gap:.35rem; font-size:.85rem; font-weight:700; color:var(--muted); text-decoration:none; margin-bottom:1.4rem; }
.ck-back:hover{ color:var(--primary); }
.ck-eyebrow{ display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.08em; color:var(--primary); background:#EEF2FF; border:1px solid #E0E7FF; padding:5px 12px; border-radius:999px; }
.ck-head h1{ font-size:1.9rem; font-weight:900; letter-spacing:-.02em; margin:.7rem 0 .4rem; line-height:1.25; }
.ck-head p{ font-size:1rem; color:var(--muted); margin:0 0 1.6rem; line-height:1.6; }
/* 진행률 */
.ck-progress{ position:sticky; top:70px; z-index:5; background:#fff; border:1px solid var(--line); border-radius:18px;
  padding:1.1rem 1.3rem; box-shadow:0 8px 30px rgba(15,23,42,.06); margin-bottom:1.8rem; }
.ck-progress-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.6rem; }
.ck-progress-top .lab{ font-size:.85rem; font-weight:800; color:var(--ink); }
.ck-progress-top .pct{ font-size:1.4rem; font-weight:900; color:var(--primary); font-variant-numeric:tabular-nums; }
.ck-bar{ height:12px; border-radius:999px; background:#EEF0F6; overflow:hidden; }
.ck-bar > i{ display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#4F46E5,#7C3AED); transition:width .35s cubic-bezier(.4,0,.2,1); }
.ck-done-msg{ font-size:.8rem; font-weight:700; color:var(--up); margin-top:.55rem; display:none; }
/* 섹션 */
.ck-sec{ margin-bottom:1.4rem; }
.ck-sec-title{ display:flex; align-items:center; gap:.5rem; font-size:.8rem; font-weight:800; letter-spacing:.03em; color:var(--muted); margin:0 0 .7rem .2rem; }
.ck-sec-title .n{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:7px; background:#EEF2FF; color:var(--primary); font-size:.72rem; font-weight:900; }
.ck-list{ list-style:none; margin:0; padding:0; }
.ck-item{ display:flex; align-items:flex-start; gap:.8rem; background:#fff; border:1px solid var(--line); border-radius:14px;
  padding:.95rem 1.1rem; margin-bottom:.55rem; cursor:pointer; transition:.15s; }
.ck-item:hover{ border-color:#C7D2FE; background:#FCFCFF; }
.ck-box{ flex-shrink:0; width:22px; height:22px; border:2px solid #CBD5E1; border-radius:7px; margin-top:1px; position:relative; transition:.15s; }
.ck-item.done .ck-box{ background:var(--primary); border-color:var(--primary); }
.ck-item.done .ck-box::after{ content:"✓"; position:absolute; inset:0; color:#fff; font-size:14px; font-weight:900; text-align:center; line-height:19px; }
.ck-text{ font-size:.95rem; font-weight:600; color:var(--ink); line-height:1.5; }
.ck-text .sub{ display:block; font-size:.8rem; font-weight:500; color:var(--muted); margin-top:.15rem; }
.ck-text .sub a{ color:var(--primary); font-weight:700; text-decoration:none; }
.ck-item.done .ck-text{ color:#94A3B8; text-decoration:line-through; text-decoration-color:#CBD5E1; }
.ck-item.done .ck-text .sub{ text-decoration:none; }
.ck-tools{ display:flex; gap:.6rem; margin-top:1.6rem; }
.ck-tools button{ font-size:.8rem; font-weight:700; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:10px; padding:.55rem 1rem; cursor:pointer; }
.ck-tools button:hover{ color:var(--primary); border-color:#C7D2FE; }
.ck-note{ margin-top:1.6rem; font-size:.78rem; color:var(--muted); line-height:1.7; background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:1rem 1.2rem; }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9744071365591766" crossorigin="anonymous"></script>
</head>
<body>
<script src="../assets/js/nav-inject.js"></script>

<div class="ck-wrap">
  <a href="../forms.html" class="ck-back">← 서식 · 도구 목록</a>
  <div class="ck-head">
    <span class="ck-eyebrow">🧮 실무 도구 · 창업</span>
    <h1>1인 창업 준비 체크리스트</h1>
    <p>한 단계도 빠뜨리지 않게. 체크하면 진행률이 <b>이 기기에 저장</b>됩니다.</p>
  </div>

  <div class="ck-progress">
    <div class="ck-progress-top"><span class="lab">전체 진행률</span><span class="pct" id="pct">0%</span></div>
    <div class="ck-bar"><i id="bar"></i></div>
    <div class="ck-done-msg" id="doneMsg">🎉 모든 준비를 마쳤어요. 이제 시작할 시간입니다!</div>
  </div>

  <div id="sections"></div>

  <div class="ck-tools">
    <button onclick="resetAll()">↺ 전체 초기화</button>
  </div>

  <div class="ck-note">
    💡 이 체크리스트는 일반적인 1인 창업 준비 흐름을 정리한 것입니다. 업종·지역에 따라 인허가와 절차가 다를 수 있으니, 세부 사항은 관할 기관·전문가에게 확인하세요. 진행률은 이 브라우저에만 저장됩니다.
  </div>
</div>

<script>
function setLang(l){ try{ localStorage.setItem('site-lang', l); }catch(e){} if (window.syncNavLang) window.syncNavLang(l); }
(function(){
  var KEY='bc_startup_check';
  var SECTIONS=[
    { t:'준비 & 검증', items:[
      {id:'p1', text:'아이템·서비스를 한 문장으로 정의', sub:'"누구의 어떤 문제를 어떻게 푼다"'},
      {id:'p2', text:'타깃 고객 구체화', sub:'막연한 "모두" 대신 좁게'},
      {id:'p3', text:'경쟁 3곳 조사 + 나만의 차별점 1가지'},
      {id:'p4', text:'최소 수익 구조 계산', sub:'<a href="tool-bep.html">손익분기 계산기</a>로 몇 개 팔아야 본전인지 확인'}
    ]},
    { t:'등록 & 법률', items:[
      {id:'r1', text:'사업자등록 신청', sub:'홈택스(온라인) 또는 세무서'},
      {id:'r2', text:'상호·도메인·SNS 핸들 확보'},
      {id:'r3', text:'업종 인허가·신고 필요 여부 확인'},
      {id:'r4', text:'표준 계약서·NDA 준비', sub:'<a href="../forms.html">서식 라이브러리</a>에서 무료로'}
    ]},
    { t:'자금 & 회계', items:[
      {id:'m1', text:'사업용 통장·카드 개인 것과 분리'},
      {id:'m2', text:'간편장부·회계 도구 세팅'},
      {id:'m3', text:'초기 3~6개월 운영비 확보'},
      {id:'m4', text:'세금 일정 파악', sub:'부가세·종합소득세 신고 시기'}
    ]},
    { t:'온라인 & 마케팅', items:[
      {id:'o1', text:'랜딩페이지 또는 스토어 오픈'},
      {id:'o2', text:'콘텐츠 채널 1개 개설', sub:'한 채널을 꾸준히 > 다섯 채널 방치'},
      {id:'o3', text:'첫 고객을 만날 유입 경로 1개 정하기'},
      {id:'o4', text:'후기·레퍼런스 수집 방법 준비'}
    ]}
  ];
  var state={};
  try{ state=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ state={}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var total=0; SECTIONS.forEach(function(s){ total+=s.items.length; });
  var wrap=document.getElementById('sections');
  wrap.innerHTML=SECTIONS.map(function(s,si){
    var lis=s.items.map(function(it){
      var done=state[it.id]?' done':'';
      var sub=it.sub?'<span class="sub">'+it.sub+'</span>':'';
      return '<li class="ck-item'+done+'" data-id="'+it.id+'"><span class="ck-box"></span>'+
        '<span class="ck-text">'+it.text+sub+'</span></li>';
    }).join('');
    return '<div class="ck-sec"><div class="ck-sec-title"><span class="n">'+(si+1)+'</span>'+s.t+'</div><ul class="ck-list">'+lis+'</ul></div>';
  }).join('');

  function update(){
    var done=0; for(var k in state){ if(state[k]) done++; }
    var pct=Math.round(done/total*100);
    document.getElementById('pct').textContent=pct+'%';
    document.getElementById('bar').style.width=pct+'%';
    document.getElementById('doneMsg').style.display = pct===100 ? 'block' : 'none';
  }
  wrap.addEventListener('click', function(e){
    var li=e.target.closest('.ck-item'); if(!li) return;
    // 링크 클릭은 이동 허용(체크 토글 안 함)
    if(e.target.tagName==='A') return;
    var id=li.getAttribute('data-id');
    state[id]=!state[id];
    li.classList.toggle('done', !!state[id]);
    save(); update();
  });
  window.resetAll=function(){
    if(!confirm('진행 상황을 모두 초기화할까요?')) return;
    state={}; save();
    document.querySelectorAll('.ck-item').forEach(function(li){ li.classList.remove('done'); });
    update();
  };
  update();
})();
</script>
<script src="../assets/js/nav.js?v=4"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/footer-inject.js"></script>
</body>
</html>
